<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>포트폴리오</title>
    <link rel="stylesheet" href="./css/reset.css" />
    <link rel="stylesheet" href="./css/style.css" />

    <script src="./js/jquery-3.7.1.min.js"></script>
    <script src="./js/script.js"></script>
  </head>
  <body>
    <section class="main">
      <!-- .gnb>(li>a)*5 -->

      <ul class="gnb">
        <li><a href="#main">Home</a></li>
        <li><a href="#about-me">About Me</a></li>
        <li><a href="#portfolio">Portfolio</a></li>
        <li><a href="#design">Design</a></li>
        <li><a href="#contact">Contact</a></li>
      </ul>

      <div class="home-title">
        <h1>Where details become experiences</h1>
        <h2>디테일을 경험으로</h2>
      </div>

      <div class="scroll-down">
        <p>Scroll Down</p>
        <div class="arrow">
          <img src="./img/scroll-down.png" alt="scroll arrow" />
        </div>
      </div>
    </section>

    <!-- section.about-me>(div.info>h1+p*4)+(div.skill>h2+div.skill-icons>img*8) -->
    <section class="about-me">
      <div class="left-section">
        <div class="info">
          <h1>About Me</h1>
          <p>이름 :이희정</p>
          <p>나이 : 만 26세</p>
          <p>학력 : 강원대학교 글로벌인재학부 영어전공(졸업)</p>
          <p>
            수료내역 : 2025.06 ~ 2025.11 하이미디어 아카데미 구로캠퍼스<br />
            피그마(Figma) 활용 UI/UX 웹디자인&웹퍼블리셔 과정 수료
          </p>
        </div>
        <div class="skills">
          <h2>SKILLS</h2>
          <div class="skill-icons">
            <img src="./img/ico-html5.png" alt="HTML5" />
            <img src="./img/ico-css3.png" alt="CSS3" />
            <img src="./img/ico-JavaScript.png" alt="JavaScript" />
            <img src="./img/ico-jquery.png" alt="jQuery" />
            <img src="./img/ico-VS Code.png" alt="VS Code" />
            <img src="./img/ico-VS Code.png" alt="Photoshop" />
            <img src="./img/ico-Illustrator.png" alt="Illustrator" />
            <img src="./img/ico-Figma.png" alt="Figma" />
          </div>
        </div>
      </div>

      <div class="about-me-right">
        <img class="profile-image" src="./img/profile.png" alt="Profile" />
      </div>
    </section>
  </body>
</html>
